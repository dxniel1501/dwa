name: Build
on: push

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        run: |
          GW=$(find . -name gradlew -not -path './.git/*' | head -n 1)
          echo "gradlew gefunden: $GW"
          test -n "$GW"
          cd "$(dirname "$GW")"
          bash ./gradlew build
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/libs/*.jar "$GITHUB_WORKSPACE/out/"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: snapshot
          name: Dev Build
          prerelease: true
          files: out/*.jar
